# Conjunto de referencia (gold standard) — BORRADOR para revisión del equipo
#
# Origen: modelo_dominio.md §7. 60 ejercicios = 2 por OA del Anillo 1 (48) + 1 extra en las 12
# unidades de fracciones y decimales. Se cargan en la tabla `ejercicio` con fuente = 'gold' y
# nunca entran en la rotación de los estudiantes.
#
#   uso_gold: fewshot     -> 1 por OA (24). Va como ejemplo en el prompt de generación del mismo OA.
#   uso_gold: validacion  -> 36. Reservados: NUNCA aparecen en un prompt. Contra ellos se mide la
#                            corrección ≥ 95 % (RNF-P1) en el piloto (tarea 58) y en las tareas 70–72.
#
# Estado: borrador. Cada ejercicio debe resolverlo a mano un integrante del equipo, sin mirar la
# respuesta_final, y luego confirmar enunciado, respuesta, pasos, errores y pistas. Al aprobarlo,
# completar revisado_por con el nombre. Un ejercicio sin revisado_por no cuenta como gold.
#
# Convenciones (modelo_dominio.md §3): respuesta_final sin punto de miles y con coma decimal;
# fracciones como "a/b" y mixtos como "c a/b"; ordenar = valores separados por "; ";
# comparar = "<", "=" o ">". regla_validacion.aceptaEquivalentes es true salvo en 5B-OA7
# (simplificar/amplificar) y 6B-OA5 (impropia <-> mixto), donde la forma es el objetivo.

ejercicios:

  # ── 4° básico ───────────────────────────────────────────────────────────────────────────

  - id: G-4B-OA1-1
    unidad_id: 4B-OA1
    nivel: 2
    uso_gold: fewshot
    enunciado: "En la biblioteca del colegio hay 4 cajas con 1.000 libros cada una, 3 cajas con 100 libros, 7 paquetes de 10 libros y 5 libros sueltos. ¿Cuántos libros hay en total?"
    formato_respuesta: numerico
    respuesta_final: "4375"
    regla_validacion: {}
    solucion_referencia:
      - "4 cajas de 1.000 son 4 unidades de mil: 4.000 libros."
      - "3 cajas de 100 son 3 centenas: 300 libros."
      - "7 paquetes de 10 son 7 decenas: 70 libros."
      - "Los 5 libros sueltos son 5 unidades."
      - "Se juntan: 4.000 + 300 + 70 + 5 = 4.375 libros."
    errores_comunes:
      - { respuesta: "19", causa: "sumó la cantidad de cajas y paquetes sin considerar cuántos libros trae cada uno", retroalimentacion: "Cada caja y cada paquete trae muchos libros. Piensa cuántos libros hay en cada grupo antes de juntarlos." }
      - { respuesta: "4357", causa: "intercambió la posición de las decenas y las unidades", retroalimentacion: "Revisa la tabla posicional: los paquetes de 10 son decenas y los libros sueltos son unidades." }
    pistas:
      - "Piensa cada grupo como una posición de la tabla: unidades de mil, centenas, decenas y unidades."
      - "Las 4 cajas de 1.000 son 4 unidades de mil. ¿Cuántas centenas, decenas y unidades hay?"
      - "Tienes 4.000, 300 y 70. Solo falta agregar los libros sueltos."
    revisado_por: null

