[project]
name = "tutor-inteligente-backend"
version = "0.1.0"
description = "API del tutor inteligente de matemáticas (eje de Números, 4° a 6° básico)"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite importar el paquete tutor con `pytest` a secas (así lo ejecuta la CI).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones copian el DDL literal de docs/modelo_base_datos.md.
"migrations/versions/*" = ["E501"]
